<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚽ ทายผลฟุตบอลโลก 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Thai', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
    .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .flag-emoji { font-size: 2rem; }
    .score-input { width: 60px; text-align: center; }
    .tab-active { border-bottom: 3px solid #f59e0b; color: #f59e0b; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="gradient-bg min-h-screen text-white">
  <!-- Navigation -->
  <nav class="bg-black/30 backdrop-blur-sm border-b border-white/10 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="showPage('welcome')">
        <span class="text-2xl">⚽</span>
        <h1 class="text-lg sm:text-xl font-bold text-amber-400">WC2026 Predictor by ลุงชา</h1>
      </div>
      <!-- Desktop menu -->
      <div id="nav-menu" class="hidden sm:flex items-center gap-3 flex-wrap">
      </div>
      <!-- Mobile hamburger -->
      <button id="mobile-menu-btn" class="sm:hidden text-2xl" onclick="toggleMobileMenu()">☰</button>
    </div>
    <!-- Mobile dropdown menu -->
    <div id="mobile-menu" class="hidden sm:hidden border-t border-white/10 bg-black/50 backdrop-blur-sm px-4 py-3">
      <div id="nav-menu-mobile" class="flex flex-col gap-2">
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div id="app-content">
      <!-- Dynamic content -->
    </div>
  </main>

  <!-- Toast notification -->
  <div id="toast" class="fixed bottom-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg hidden transition-all duration-300 z-50"></div>

  <script src="app.js"></script>
</body>
</html>
